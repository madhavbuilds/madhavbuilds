<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 184" width="276" height="184" role="img" aria-label="Ship: 3 packages. create-own-ai on npm, Vett on PyPI and the EvalKit dataset on Hugging Face."><title>Ship: 3 packages. create-own-ai on npm, Vett on PyPI and the EvalKit dataset on Hugging Face.</title><style>@font-face{font-family:"mp-i";font-weight:400;src:url(data:font/woff;base64,) format("woff")}
.i{font-family:"mp-i",Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;}
@font-face{font-family:"mp-k";font-weight:400;src:url(data:font/woff;base64,) format("woff")}
.k{font-family:"mp-k",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400;}
@font-face{font-family:"mp-r";font-weight:400;src:url(data:font/woff;base64,) format("woff")}
.r{font-family:"mp-r",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400;}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes nudge{from{opacity:0;transform:translate(-6px,6px)}}
@keyframes wipe{from{transform:scaleY(1)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .75s cubic-bezier(.3,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.nudge{animation:nudge .5s cubic-bezier(.2,.7,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:wipe 1.6s cubic-bezier(.5,0,.3,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="275" height="183" rx="14" fill="#ec3a25"/><g class="fade" style="animation-delay:1.40s"><text x="22.0" y="38.0" class="k" font-size="10.5" fill="#ffffffd9" letter-spacing="1.3">SHIP</text></g><g class="nudge" style="animation-delay:1.70s"><path d="M245 38 L254 29 M247.5 29 H254 V35.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="rise" style="animation-delay:1.45s"><text x="22.0" y="104.0" class="i" font-size="44" fill="#ffffff" letter-spacing="-0.6">3 packages</text></g><g class="rise" style="animation-delay:1.52s"><text x="22.0" y="134.0" class="r" font-size="12.5" fill="#ffffff">create-own-ai on npm, Vett on PyPI</text></g><g class="rise" style="animation-delay:1.56s"><text x="22.0" y="151.5" class="r" font-size="12.5" fill="#ffffff">and the EvalKit dataset on Hugging</text></g><g class="rise" style="animation-delay:1.60s"><text x="22.0" y="169.0" class="r" font-size="12.5" fill="#ffffff">Face.</text></g></svg>